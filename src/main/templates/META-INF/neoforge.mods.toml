side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="actuallyadditions"
type="required"
versionRange="[1.3,)"
ordering="NONE"
side="BOTH"
